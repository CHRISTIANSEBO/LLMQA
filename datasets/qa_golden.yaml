# Golden dataset — 12 cases, easy → hard.
# gate_metrics controls which metric(s) decide pass/fail per case; others are
# still scored and shown (informational). Omit to gate on all metrics.

# ── EASY ─────────────────────────────────────────────────────────────────────
- id: capital-france
  input: "What is the capital of France?"
  expected: "Paris"
  tags: [factual, easy]
  gate_metrics: [exact_match]

- id: math-multiply
  input: "What is 12 multiplied by 12? Reply with only the number."
  expected: "144"
  tags: [math, easy]
  gate_metrics: [exact_match]

- id: uppercase-only
  input: "Reply with only the word 'yes' in uppercase."
  expected: "YES"
  tags: [instruction-following, easy]
  gate_metrics: [exact_match]

# ── MEDIUM ───────────────────────────────────────────────────────────────────
- id: sentiment-negative
  input: 'Classify the sentiment as positive, negative, or neutral: "This is the worst product I have ever bought." Reply with one word.'
  expected: "negative"
  tags: [classification, medium]
  gate_metrics: [exact_match]

- id: json-extract
  input: 'Extract name and age as JSON from: "Maria is 34 years old." Reply with only valid JSON, no extra text.'
  expected: '{"name": "Maria", "age": 34}'
  tags: [structured, medium]
  gate_metrics: [exact_match]

- id: logical-deduction
  input: "All mammals are warm-blooded. Dolphins are mammals. Are dolphins warm-blooded? Reply yes or no."
  expected: "yes"
  tags: [reasoning, medium]
  gate_metrics: [exact_match]

- id: negation-edge
  input: "True or false: All birds can fly. Reply with one word."
  expected: "false"
  tags: [reasoning, medium, edge-case]
  gate_metrics: [exact_match]

# ── HARD ─────────────────────────────────────────────────────────────────────
- id: grounded-answer
  input: "According to the context, what year was the company founded?"
  context: "Acme Corp was founded in 1998 in Denver and now employs 500 people."
  expected: "1998"
  tags: [rag, hard]
  gate_metrics: [exact_match, hallucination]

- id: refuse-hallucination
  input: "According to the context, who is the CEO?"
  context: "Acme Corp was founded in 1998 in Denver and now employs 500 people."
  expected: "The context does not say who the CEO is."
  tags: [rag, adversarial, hard]
  gate_metrics: [hallucination]

- id: refuse-no-revenue
  input: "According to the context, what is the company's revenue?"
  context: "Nexus Corp announced Q3 results today, noting strong growth in cloud services and a new partnership with three Fortune 500 companies."
  expected: "The context does not mention revenue figures."
  tags: [rag, adversarial, hard]
  gate_metrics: [hallucination]

- id: summarize
  input: "Summarize in one sentence: The mitochondria is the powerhouse of the cell, producing ATP through cellular respiration."
  expected: "Mitochondria produce the cell's energy (ATP) via cellular respiration."
  tags: [summarization, hard]
  gate_metrics: [llm_judge]

- id: summarize-technical
  input: "Summarize in one sentence: Transformer models use self-attention mechanisms to weigh the importance of different tokens in a sequence, enabling them to capture long-range dependencies more effectively than recurrent architectures."
  expected: "Transformers use self-attention to capture long-range dependencies better than recurrent models."
  tags: [summarization, technical, hard]
  gate_metrics: [llm_judge]
