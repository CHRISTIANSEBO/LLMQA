- id: summarize-climate-report
  input: |
    Summarize the following passage in 1-2 sentences:

    A recent IPCC report warns that global temperatures are likely to rise by 1.5 degrees Celsius above pre-industrial levels within the next two decades if greenhouse gas emissions continue at current rates. The report emphasizes the urgent need for rapid and deep reductions in emissions across all sectors, including energy, transportation, and agriculture. It also highlights that many climate impacts, such as extreme weather events and sea-level rise, are already irreversible.
  expected: The IPCC report projects a 1.5°C temperature rise within 20 years without major emission cuts and stresses the need for immediate, deep reductions across key sectors while noting some climate impacts are now irreversible.
  tags: ["climate", "environment", "report"]
  gate_metrics: ["llm_judge"]

