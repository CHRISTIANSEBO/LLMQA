name: "LLMQA quality gate"
description: "Run an LLMQA evaluation and gate the build on pass rate / regression. Emits JUnit XML and GitHub annotations."
branding:
  icon: "check-circle"
  color: "green"

inputs:
  provider:
    description: "Provider to evaluate (mock, mock-strong, anthropic, openai, xai, ollama, openai-compat)."
    required: false
    default: "mock"
  dataset:
    description: "A dataset file path in your repo, or a name shipped in LLMQA (e.g. qa_golden.yaml)."
    required: false
    default: "qa_golden.yaml"
  metrics:
    description: "Space-separated metrics to run."
    required: false
    default: "exact_match similarity llm_judge hallucination"
  min-pass-rate:
    description: "Fail the job if the pass rate is below this (0-1). Empty to skip."
    required: false
    default: "0.8"
  regression:
    description: "Compare against the last stored run and fail on regression (true/false)."
    required: false
    default: "false"
  concurrency:
    description: "Cases to run in parallel."
    required: false
    default: "4"
  junit-path:
    description: "Where to write the JUnit XML report."
    required: false
    default: "llmqa-results.xml"
  python-version:
    description: "Python version to set up."
    required: false
    default: "3.11"
  comment-on-pr:
    description: "On pull_request events, post/update a sticky comment with the results (true/false)."
    required: false
    default: "true"
  github-token:
    description: "Token used to post the PR comment. Needs pull-requests: write."
    required: false
    default: ${{ github.token }}
  summary-path:
    description: "Where to write the Markdown summary used for the PR comment / job summary."
    required: false
    default: "llmqa-summary.md"

outputs:
  junit-path:
    description: "Path to the JUnit XML report that was written."
    value: ${{ inputs.junit-path }}
  summary-path:
    description: "Path to the Markdown summary that was written."
    value: ${{ inputs.summary-path }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install LLMQA
      shell: bash
      run: python -m pip install --upgrade pip && pip install "llmqa[web,providers] @ git+https://github.com/CHRISTIANSEBO/LLMQA@main" || pip install -e "${{ github.action_path }}[web,providers]"

    - name: Run evaluation gate
      shell: bash
      run: |
        llmqa run \
          --provider "${{ inputs.provider }}" \
          --dataset "${{ inputs.dataset }}" \
          --metrics ${{ inputs.metrics }} \
          --concurrency "${{ inputs.concurrency }}" \
          --junit "${{ inputs.junit-path }}" \
          --summary "${{ inputs.summary-path }}" \
          --github-summary \
          --github-annotations \
          --no-store \
          ${{ inputs.min-pass-rate != '' && format('--min-pass-rate {0}', inputs.min-pass-rate) || '' }} \
          ${{ inputs.regression == 'true' && '--regression' || '' }}

    - name: Comment results on the pull request
      # Runs even when the gate above failed, so the PR always shows the report.
      if: always() && github.event_name == 'pull_request' && inputs.comment-on-pr == 'true'
      uses: actions/github-script@v7
      env:
        LLMQA_SUMMARY_PATH: ${{ inputs.summary-path }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          let body;
          try {
            body = fs.readFileSync(process.env.LLMQA_SUMMARY_PATH, 'utf8');
          } catch (e) {
            core.info('No LLMQA summary file found; skipping PR comment.');
            return;
          }
          const marker = '<!-- llmqa-report -->';
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner, repo, issue_number,
          });
          const existing = comments.find(c => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }
