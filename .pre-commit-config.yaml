# Local git hooks. Install once with:
#   pip install pre-commit && pre-commit install
# Run against everything:
#   pre-commit run --all-files
#
# Ruff uses the config already in pyproject.toml, so linting here matches CI
# (`ruff check`). `ruff-format` is intentionally not enabled so the hook can't
# diverge from CI; enable it in a dedicated formatting pass if desired.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
