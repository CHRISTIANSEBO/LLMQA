name: publish

# Build and publish the package to PyPI when a version tag is pushed
# (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
#
# This uses PyPI Trusted Publishing (OIDC) - no API token is stored in the
# repo. Configure the trusted publisher once on PyPI:
#   PyPI -> project `llmqa` -> Publishing -> add a GitHub publisher with
#   owner=CHRISTIANSEBO, repo=LLMQA, workflow=publish.yml, environment=pypi.

on:
  push:
    tags:
      - "v*"
  # Allow a manual dry run (build only, no publish) from the Actions tab.
  workflow_dispatch:

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    # Only publish on an actual tag push, never on a manual dry run.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/llmqa
    permissions:
      # Required for Trusted Publishing (OIDC token exchange with PyPI).
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
