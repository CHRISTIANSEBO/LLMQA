[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmqa"
version = "0.1.0"
description = "A lightweight LLM Quality Assurance / evaluation harness: golden dataset, pluggable metrics, and CI quality + regression gates."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Christian Sebo" }]
keywords = ["llm", "evaluation", "quality-assurance", "testing", "ci", "regression"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core runtime: everything needed to run evaluations against the
# deterministic, key-free `mock` providers (fast/free CI, offline demos).
dependencies = [
    "pydantic>=2.6.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Live model providers (only needed to hit real anthropic/openai/xai).
providers = [
    "anthropic>=0.40.0",
    "openai>=1.0.0",
]
# FastAPI web dashboard.
web = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]
# Test + lint tooling.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]
# Everything, for a full local install.
all = [
    "llmqa[providers,web,dev]",
]

[project.urls]
Homepage = "https://github.com/CHRISTIANSEBO/LLMQA"
Repository = "https://github.com/CHRISTIANSEBO/LLMQA"
Changelog = "https://github.com/CHRISTIANSEBO/LLMQA/blob/main/CHANGELOG.md"
Issues = "https://github.com/CHRISTIANSEBO/LLMQA/issues"
"Live demo" = "https://llmqa-production.up.railway.app/"

[project.scripts]
llmqa = "cli:main"

[tool.hatch.build.targets.wheel]
# The importable package plus the top-level CLI module and the golden dataset.
packages = ["llmqa"]
# Ship the PEP 561 marker so downstream type checkers see llmqa's type hints.
artifacts = ["llmqa/py.typed"]
include = [
    "cli.py",
    "server.py",
    "datasets/*.yaml",
]

[tool.hatch.build.targets.wheel.force-include]
"cli.py" = "cli.py"
"server.py" = "server.py"
"datasets" = "datasets"

[tool.hatch.build.targets.sdist]
include = [
    "/llmqa",
    "/cli.py",
    "/server.py",
    "/datasets",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# A pragmatic, non-noisy default: pyflakes (F), pycodestyle errors (E),
# import sorting (I), bugbear (B), and pyupgrade (UP).
select = ["E", "F", "I", "B", "UP"]
# Long lines are handled case-by-case; keep the harness readable.
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# cli.py and server.py deliberately call load_dotenv() before importing modules
# that read env at import time, so their imports aren't at the very top.
"cli.py" = ["E402"]
"server.py" = ["E402"]
"llmqa/web/__main__.py" = ["E402"]

# pytest is configured in pytest.ini (it defines python_classes + pythonpath).

[tool.coverage.run]
source = ["llmqa", "cli"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
# CI fails if coverage drops below this. Raise over time.
fail_under = 80
show_missing = true
